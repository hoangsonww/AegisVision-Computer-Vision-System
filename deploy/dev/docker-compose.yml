# Local development backing services for the full AegisVision stack.
#
# This compose file brings up everything the platform expects when you
# run any production-shape Go service locally (i.e. anything past the
# walking-skeleton's 5 services). The platform services themselves are
# NOT in this file — run those with `task run:<service>` so you can
# iterate without rebuilding container images.
#
# Usage (from the repo root):
#
#   cd deploy/dev
#   docker compose up -d
#   # Wait for "healthy" status on every container.
#   docker compose ps
#
# Then in a separate terminal (or a `task run:<service>` invocation),
# export the connection URLs the platform services read:
#
#   export AEGIS_NATS_URL=nats://127.0.0.1:4222
#   export AEGIS_KAFKA_BROKERS=127.0.0.1:9092
#   export AEGIS_POSTGRES_DSN='postgres://aegis:aegis@127.0.0.1:5432/aegis?sslmode=disable'
#   export AEGIS_REDIS_ADDR=127.0.0.1:6379
#   export AEGIS_CLICKHOUSE_URL=tcp://default:@127.0.0.1:9000/aegis
#   export AEGIS_S3_ENDPOINT=http://127.0.0.1:9100
#   export AEGIS_S3_ACCESS_KEY=aegisadmin
#   export AEGIS_S3_SECRET_KEY=aegisadmin123
#   export AEGIS_OTLP_ENDPOINT=127.0.0.1:4317
#
# To tear down:
#
#   docker compose down -v
#
# Volumes are wiped on `down -v` — there is no PII / production state in
# this stack. For persistent dev state, drop `-v`.

services:

  # ----- Postgres (Patroni-compatible single-node) -----
  postgres:
    image: postgres:16-alpine
    container_name: aegis-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
      POSTGRES_DB: aegis
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 5s
      timeout: 3s
      retries: 12
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - wal_level=logical

  # ----- Redis (rate-limit + idempotency cache) -----
  redis:
    image: redis:7-alpine
    container_name: aegis-dev-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ----- NATS JetStream (low-latency bus) -----
  nats:
    image: nats:2.10-alpine
    container_name: aegis-dev-nats
    restart: unless-stopped
    ports:
      - "4222:4222"   # client
      - "8222:8222"   # monitoring
    command:
      - --jetstream
      - --store_dir=/data
      - --http_port=8222
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz | grep -q 'ok'"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ----- Kafka (durable bus) -----
  # Single-broker KRaft (no Zookeeper) — for dev parity with the
  # production 3-broker cluster.
  kafka:
    image: bitnami/kafka:3.7
    container_name: aegis-dev-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://127.0.0.1:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 18

  # ----- ClickHouse (event firehose) -----
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: aegis-dev-clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"   # HTTP
      - "9000:9000"   # native
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_DB: aegis
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ----- MinIO (S3-compatible object store + Triton model repo) -----
  minio:
    image: minio/minio:RELEASE.2025-03-12T18-04-18Z
    container_name: aegis-dev-minio
    restart: unless-stopped
    ports:
      - "9100:9000"   # S3 API (mapped off 9000 to avoid ClickHouse clash)
      - "9101:9001"   # console
    environment:
      MINIO_ROOT_USER: aegisadmin
      MINIO_ROOT_PASSWORD: aegisadmin123
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ----- MinIO bootstrap — create the default buckets the platform expects -----
  minio-bootstrap:
    image: minio/mc:RELEASE.2025-03-12T17-29-24Z
    container_name: aegis-dev-minio-bootstrap
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mc alias set local http://minio:9000 aegisadmin aegisadmin123
        for bucket in aegis-claimcheck aegis-models aegis-recordings aegis-evidence; do
          mc mb --ignore-existing local/$$bucket
        done
        mc anonymous set download local/aegis-models  # so Triton can pull without creds in dev
        echo "MinIO buckets ready."

  # ----- OpenTelemetry collector (OTLP -> Tempo + Prometheus in prod;
  #       OTLP -> stdout in dev so you can `docker logs` traces) -----
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    container_name: aegis-dev-otel
    restart: unless-stopped
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro

  # ----- pgAdmin (web UI, optional) -----
  pgadmin:
    image: dpage/pgadmin4:8.13
    container_name: aegis-dev-pgadmin
    profiles: [tools]
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: dev@aegisvision.local
      PGADMIN_DEFAULT_PASSWORD: aegis
      PGADMIN_CONFIG_SERVER_MODE: "False"

volumes:
  postgres-data:
  redis-data:
  nats-data:
  kafka-data:
  clickhouse-data:
  minio-data:
