# Redis Sentinel — HA mode (1 master + 2 replicas, 3 Sentinel observers).
# Used by api-gateway (idempotency cache), realtime-hub (session pinning),
# inference-router (model warm-cache).
---
apiVersion: v1
kind: ConfigMap
metadata: { name: redis-conf, namespace: aegis-data }
data:
  redis.conf: |
    port 6379
    appendonly yes
    masterauth ${REDIS_PASSWORD}
    requirepass ${REDIS_PASSWORD}
    maxmemory 8gb
    maxmemory-policy allkeys-lru
    tcp-keepalive 60
    save 60 10000
  sentinel.conf: |
    port 26379
    sentinel monitor mymaster redis-0.redis-headless 6379 2
    sentinel auth-pass mymaster ${REDIS_PASSWORD}
    sentinel down-after-milliseconds mymaster 5000
    sentinel failover-timeout mymaster 60000
    sentinel parallel-syncs mymaster 1
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: redis, namespace: aegis-data, labels: { app.kubernetes.io/name: redis } }
spec:
  serviceName: redis-headless
  replicas: 3
  selector: { matchLabels: { app.kubernetes.io/name: redis } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: redis }
    spec:
      priorityClassName: aegis-system-critical
      securityContext: { runAsNonRoot: true, runAsUser: 999, fsGroup: 999, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: redis
          image: redis:7.4-alpine
          command: ["redis-server", "/etc/redis/redis.conf"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          ports: [{ name: redis, containerPort: 6379 }]
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: redis-credentials, key: password } }
          volumeMounts:
            - { name: conf, mountPath: /etc/redis }
            - { name: data, mountPath: /data }
          resources: { requests: { cpu: 500m, memory: 4Gi }, limits: { cpu: "2", memory: 8Gi } }
        - name: sentinel
          image: redis:7.4-alpine
          command: ["redis-sentinel", "/etc/redis/sentinel.conf"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          ports: [{ name: sentinel, containerPort: 26379 }]
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: redis-credentials, key: password } }
          volumeMounts:
            - { name: conf, mountPath: /etc/redis }
          resources: { requests: { cpu: 100m, memory: 256Mi } }
      volumes:
        - name: conf
          configMap: { name: redis-conf }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: standard
        resources: { requests: { storage: 50Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: redis-headless, namespace: aegis-data }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: redis }
  ports:
    - { name: redis, port: 6379 }
    - { name: sentinel, port: 26379 }
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: aegis-data, labels: { app.kubernetes.io/name: redis } }
spec:
  selector: { app.kubernetes.io/name: redis }
  ports:
    - { name: redis, port: 6379, targetPort: 6379, appProtocol: tcp }
    - { name: sentinel, port: 26379, targetPort: 26379 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: redis, namespace: aegis-data }
spec:
  minAvailable: 2
  selector: { matchLabels: { app.kubernetes.io/name: redis } }
