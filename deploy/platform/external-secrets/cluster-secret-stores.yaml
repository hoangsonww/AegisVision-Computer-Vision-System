# External Secrets Operator wiring. ClusterSecretStore points at Vault;
# ExternalSecret resources in each service namespace reference it.
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aegis-vault
spec:
  provider:
    vault:
      server: https://vault.aegis-security.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: aegis-platform
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
      caProvider:
        type: ConfigMap
        name: vault-ca
        namespace: aegis-security
        key: ca.crt
---
# Example: api-gateway pulls its cursor signing key from Vault.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: api-gateway-secrets
  namespace: aegis-system
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: aegis-vault
    kind: ClusterSecretStore
  target:
    name: api-gateway-secrets
  data:
    - secretKey: cursor_key
      remoteRef: { key: aegisvision/api-gateway, property: cursor_key }
---
# Postgres DSN for model-registry pulled from Vault.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: model-registry-db
  namespace: aegis-system
spec:
  refreshInterval: 5m
  secretStoreRef: { name: aegis-vault, kind: ClusterSecretStore }
  target: { name: model-registry-db }
  data:
    - secretKey: dsn
      remoteRef: { key: aegisvision/postgres/model-registry, property: dsn }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: audit-db
  namespace: aegis-system
spec:
  refreshInterval: 5m
  secretStoreRef: { name: aegis-vault, kind: ClusterSecretStore }
  target: { name: audit-db }
  data:
    - secretKey: dsn
      remoteRef: { key: aegisvision/postgres/audit, property: dsn }
