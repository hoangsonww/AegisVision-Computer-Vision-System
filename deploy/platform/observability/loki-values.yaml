# Loki for log aggregation. SimpleScalable mode handles up to ~1TB/day on
# moderate hardware; production at 10k streams scale switches to Distributed.
loki:
  auth_enabled: true
  schema_config:
    configs:
      - from: 2026-01-01
        store: tsdb
        object_store: s3
        schema: v13
        index: { prefix: loki_index_, period: 24h }
  storage:
    type: s3
    bucketNames:
      chunks: aegis-loki-chunks
      ruler:  aegis-loki-ruler
      admin:  aegis-loki-admin
deploymentMode: SimpleScalable
write:
  replicas: 3
  resources:
    requests: { cpu: 500m, memory: 2Gi }
read:
  replicas: 3
  resources:
    requests: { cpu: 500m, memory: 2Gi }
backend:
  replicas: 3
gateway:
  enabled: true
  service:
    type: ClusterIP
