apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: { name: gpu-scheduler, namespace: aegis-system }
spec:
  selector: { matchLabels: { app.kubernetes.io/name: gpu-scheduler } }
  action: ALLOW
  rules:
    - from:
        - source: { principals: [cluster.local/ns/aegis-system/sa/api-gateway] }
      to: [{ operation: { ports: ["8200"] } }]
    - from:
        - source: { principals: [cluster.local/ns/aegis-observability/sa/prometheus] }
      to: [{ operation: { ports: ["8201"] } }]
