# Minimal NATS chart for the walking skeleton. Production usually pulls the
# official NATS chart from charts.nats.io as a subchart; replicating the
# essentials here keeps the ArgoCD ApplicationSet's directory-generator
# pattern uniform.
image:
  repository: nats
  tag: "2.10.22-alpine"
  pullPolicy: IfNotPresent
replicaCount: 3
storageSize: 10Gi
storageClass: standard
priorityClassName: aegis-system-critical
resources:
  requests: { cpu: 250m, memory: 512Mi }
  limits:   { cpu: "2",  memory: 2Gi }
