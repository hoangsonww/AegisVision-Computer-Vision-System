apiVersion: apps/v1
kind: StatefulSet
metadata: { name: nats, namespace: aegis-data, labels: { app.kubernetes.io/name: nats } }
spec:
  serviceName: nats-headless
  replicas: {{ .Values.replicaCount }}
  selector: { matchLabels: { app.kubernetes.io/name: nats } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: nats }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "7777"
    spec:
      priorityClassName: {{ .Values.priorityClassName | quote }}
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: nats
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["-c", "/etc/nats/nats.conf"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          ports:
            - { name: client, containerPort: 4222 }
            - { name: cluster, containerPort: 6222 }
            - { name: monitor, containerPort: 8222 }
          volumeMounts:
            - { name: conf, mountPath: /etc/nats }
            - { name: data, mountPath: /data }
          readinessProbe: { httpGet: { path: /, port: monitor }, initialDelaySeconds: 5, periodSeconds: 5 }
          livenessProbe:  { httpGet: { path: /, port: monitor }, initialDelaySeconds: 10, periodSeconds: 10 }
          resources: {{ toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: conf
          configMap: { name: nats-conf }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.storageClass | quote }}
        resources: { requests: { storage: {{ .Values.storageSize | quote }} } }
