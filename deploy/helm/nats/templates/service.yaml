apiVersion: v1
kind: Service
metadata: { name: nats, namespace: aegis-data, labels: { app.kubernetes.io/name: nats } }
spec:
  selector: { app.kubernetes.io/name: nats }
  ports:
    - { name: client, port: 4222, targetPort: 4222 }
    - { name: monitor, port: 8222, targetPort: 8222 }
---
apiVersion: v1
kind: Service
metadata: { name: nats-headless, namespace: aegis-data }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: nats }
  ports:
    - { name: cluster, port: 6222, targetPort: 6222 }
