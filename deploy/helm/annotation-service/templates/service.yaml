apiVersion: v1
kind: Service
metadata: { name: annotation-service, namespace: aegis-system, labels: { app.kubernetes.io/name: annotation-service } }
spec:
  selector: { app.kubernetes.io/name: annotation-service }
  ports:
    - { name: http, port: 8260, targetPort: 8260, appProtocol: http }
    - { name: metrics, port: 8261, targetPort: 8261 }
