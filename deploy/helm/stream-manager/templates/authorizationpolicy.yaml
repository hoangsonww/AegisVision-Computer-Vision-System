apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: stream-manager
  namespace: aegis-system
spec:
  selector: { matchLabels: { app.kubernetes.io/name: stream-manager } }
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/aegis-system/sa/api-gateway
              - cluster.local/ns/aegis-system/sa/agent-service
      to:
        - operation: { ports: ["9092"] }
    - from:
        - source:
            principals: [cluster.local/ns/aegis-observability/sa/prometheus]
      to:
        - operation: { ports: ["9093"] }
