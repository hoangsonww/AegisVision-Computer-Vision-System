apiVersion: apps/v1
kind: Deployment
metadata:
  name: stream-manager
  namespace: aegis-system
  labels:
    app.kubernetes.io/name: stream-manager
    app.kubernetes.io/component: control-plane
spec:
  replicas: {{ .Values.replicaCount }}
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 25%, maxUnavailable: 0 } }
  selector: { matchLabels: { app.kubernetes.io/name: stream-manager } }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stream-manager
        app.kubernetes.io/component: control-plane
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9093"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: stream-manager
      priorityClassName: {{ .Values.priorityClassName | quote }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: stream-manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          ports:
            - { name: grpc, containerPort: 9092 }
            - { name: metrics, containerPort: 9093 }
          env:
            - { name: AEGIS_ENV, value: {{ .Values.env | quote }} }
            - { name: AEGIS_VERSION, value: {{ .Values.image.tag | quote }} }
            - { name: AEGIS_LOG_LEVEL, value: {{ .Values.logLevel | quote }} }
            - { name: AEGIS_GRPC_ADDR, value: ":9092" }
            - { name: AEGIS_HEALTH_ADDR, value: ":9093" }
            - { name: AEGIS_NATS_URL, value: {{ .Values.nats.url | quote }} }
            - { name: AEGIS_OTLP_ENDPOINT, value: {{ .Values.otel.endpoint | quote }} }
          readinessProbe: { httpGet: { path: /readyz, port: metrics }, initialDelaySeconds: 2, periodSeconds: 5 }
          livenessProbe:  { httpGet: { path: /healthz, port: metrics }, initialDelaySeconds: 10, periodSeconds: 10 }
          resources: {{ toYaml .Values.resources | nindent 12 }}
