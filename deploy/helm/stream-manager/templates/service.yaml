apiVersion: v1
kind: Service
metadata:
  name: stream-manager
  namespace: aegis-system
  labels: { app.kubernetes.io/name: stream-manager }
spec:
  selector: { app.kubernetes.io/name: stream-manager }
  ports:
    - { name: grpc, port: 9092, targetPort: 9092, appProtocol: grpc }
    - { name: metrics, port: 9093, targetPort: 9093 }
