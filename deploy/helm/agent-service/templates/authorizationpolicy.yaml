apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: { name: agent-service, namespace: aegis-system }
spec:
  selector: { matchLabels: { app.kubernetes.io/name: agent-service } }
  action: ALLOW
  rules:
    - from:
        - source: { principals: [cluster.local/ns/aegis-system/sa/api-gateway] }
      to: [{ operation: { ports: ["8420"] } }]
    - from:
        - source: { principals: [cluster.local/ns/aegis-observability/sa/prometheus] }
      to: [{ operation: { ports: ["8421"] } }]
