apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: prefetch-service, namespace: aegis-system }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: prefetch-service } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: inference-router } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: api-gateway } }
      ports: [{ port: 8500, protocol: TCP }]
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: aegis-observability } }
          podSelector: { matchLabels: { app.kubernetes.io/name: prometheus } }
      ports: [{ port: 8501, protocol: TCP }]
