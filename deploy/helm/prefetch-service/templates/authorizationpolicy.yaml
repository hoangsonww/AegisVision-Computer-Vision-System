apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: { name: prefetch-service, namespace: aegis-system }
spec:
  selector: { matchLabels: { app.kubernetes.io/name: prefetch-service } }
  action: ALLOW
  rules:
    - from:
        - source: { principals: [cluster.local/ns/aegis-system/sa/inference-router, cluster.local/ns/aegis-system/sa/api-gateway] }
      to: [{ operation: { ports: ["8500"] } }]
    - from:
        - source: { principals: [cluster.local/ns/aegis-observability/sa/prometheus] }
      to: [{ operation: { ports: ["8501"] } }]
