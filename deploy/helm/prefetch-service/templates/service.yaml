apiVersion: v1
kind: Service
metadata: { name: prefetch-service, namespace: aegis-system, labels: { app.kubernetes.io/name: prefetch-service } }
spec:
  selector: { app.kubernetes.io/name: prefetch-service }
  ports:
    - { name: http, port: 8500, targetPort: 8500, appProtocol: http }
    - { name: metrics, port: 8501, targetPort: 8501 }
