apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: { name: drift-detection-service, namespace: aegis-system }
spec:
  selector: { matchLabels: { app.kubernetes.io/name: drift-detection-service } }
  action: ALLOW
  rules:
    - from:
        - source: { principals: [cluster.local/ns/aegis-system/sa/autonomy-orchestrator, cluster.local/ns/aegis-system/sa/api-gateway] }
      to: [{ operation: { ports: ["8480"] } }]
    - from:
        - source: { principals: [cluster.local/ns/aegis-observability/sa/prometheus] }
      to: [{ operation: { ports: ["8481"] } }]
