apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: drift-detection-service, namespace: aegis-system }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: drift-detection-service } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: autonomy-orchestrator } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: api-gateway } }
      ports: [{ port: 8480, protocol: TCP }]
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: aegis-observability } }
          podSelector: { matchLabels: { app.kubernetes.io/name: prometheus } }
      ports: [{ port: 8481, protocol: TCP }]
