{{ '{{- if .Values.serviceMonitor.enabled }}' }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: { name: drift-detection-service, namespace: aegis-system, labels: { release: prometheus } }
spec:
  selector: { matchLabels: { app.kubernetes.io/name: drift-detection-service } }
  endpoints: [{ port: metrics, interval: {{ '{{ .Values.serviceMonitor.interval }}' }}, path: /metrics }]
{{ '{{- end }}' }}
