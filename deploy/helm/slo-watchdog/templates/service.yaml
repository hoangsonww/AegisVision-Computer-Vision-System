apiVersion: v1
kind: Service
metadata: { name: slo-watchdog, namespace: aegis-system, labels: { app.kubernetes.io/name: slo-watchdog } }
spec:
  selector: { app.kubernetes.io/name: slo-watchdog }
  ports:
    - { name: http, port: 8490, targetPort: 8490, appProtocol: http }
    - { name: metrics, port: 8491, targetPort: 8491 }
