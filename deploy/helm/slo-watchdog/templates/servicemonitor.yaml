{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: { name: slo-watchdog, namespace: aegis-system, labels: { release: prometheus } }
spec:
  selector: { matchLabels: { app.kubernetes.io/name: slo-watchdog } }
  endpoints: [{ port: metrics, interval: {{ .Values.serviceMonitor.interval }}, path: /metrics }]
{{- end }}
