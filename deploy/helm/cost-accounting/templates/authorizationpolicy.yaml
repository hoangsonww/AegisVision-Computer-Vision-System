apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: { name: cost-accounting, namespace: aegis-system }
spec:
  selector: { matchLabels: { app.kubernetes.io/name: cost-accounting } }
  action: ALLOW
  rules:
    - from:
        - source: { principals: [cluster.local/ns/aegis-system/sa/api-gateway] }
      to: [{ operation: { ports: ["8330"] } }]
    - from:
        - source: { principals: [cluster.local/ns/aegis-observability/sa/prometheus] }
      to: [{ operation: { ports: ["8331"] } }]
