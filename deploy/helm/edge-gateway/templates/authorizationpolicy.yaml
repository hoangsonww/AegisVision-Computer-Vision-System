apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: { name: edge-gateway, namespace: aegis-system }
spec:
  selector: { matchLabels: { app.kubernetes.io/name: edge-gateway } }
  action: ALLOW
  rules:
    - from:
        - source: { principals: [cluster.local/ns/aegis-system/sa/api-gateway] }
      to: [{ operation: { ports: ["8320"] } }]
    - from:
        - source: { principals: [cluster.local/ns/aegis-observability/sa/prometheus] }
      to: [{ operation: { ports: ["8321"] } }]
