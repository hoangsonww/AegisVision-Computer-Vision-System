apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: { name: semantic-search, namespace: aegis-system }
spec:
  selector: { matchLabels: { app.kubernetes.io/name: semantic-search } }
  action: ALLOW
  rules:
    - from:
        - source: { principals: [cluster.local/ns/aegis-system/sa/api-gateway] }
      to: [{ operation: { ports: ["8290"] } }]
    - from:
        - source: { principals: [cluster.local/ns/aegis-observability/sa/prometheus] }
      to: [{ operation: { ports: ["8291"] } }]
