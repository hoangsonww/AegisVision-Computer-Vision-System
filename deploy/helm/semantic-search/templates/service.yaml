apiVersion: v1
kind: Service
metadata: { name: semantic-search, namespace: aegis-system, labels: { app.kubernetes.io/name: semantic-search } }
spec:
  selector: { app.kubernetes.io/name: semantic-search }
  ports:
    - { name: http, port: 8290, targetPort: 8290, appProtocol: http }
    - { name: metrics, port: 8291, targetPort: 8291 }
