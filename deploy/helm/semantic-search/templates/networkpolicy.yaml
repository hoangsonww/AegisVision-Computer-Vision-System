apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: semantic-search, namespace: aegis-system }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: semantic-search } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: api-gateway } }
      ports: [{ port: 8290, protocol: TCP }]
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: aegis-observability } }
          podSelector: { matchLabels: { app.kubernetes.io/name: prometheus } }
      ports: [{ port: 8291, protocol: TCP }]
