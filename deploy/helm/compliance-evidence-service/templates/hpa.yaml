{{ '{{- if .Values.autoscaling.enabled }}' }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: compliance-evidence-service, namespace: aegis-system }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: compliance-evidence-service }
  minReplicas: {{ '{{ .Values.autoscaling.minReplicas }}' }}
  maxReplicas: {{ '{{ .Values.autoscaling.maxReplicas }}' }}
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: {{ '{{ .Values.autoscaling.targetCPUUtilizationPercentage }}' }} } }
{{ '{{- end }}' }}
