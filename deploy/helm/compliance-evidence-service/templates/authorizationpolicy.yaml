apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: { name: compliance-evidence-service, namespace: aegis-system }
spec:
  selector: { matchLabels: { app.kubernetes.io/name: compliance-evidence-service } }
  action: ALLOW
  rules:
    - from:
        - source: { principals: [cluster.local/ns/aegis-system/sa/api-gateway] }
      to: [{ operation: { ports: ["8520"] } }]
    - from:
        - source: { principals: [cluster.local/ns/aegis-observability/sa/prometheus] }
      to: [{ operation: { ports: ["8521"] } }]
