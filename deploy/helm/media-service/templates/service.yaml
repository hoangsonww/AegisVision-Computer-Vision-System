apiVersion: v1
kind: Service
metadata: { name: media-service, namespace: aegis-system, labels: { app.kubernetes.io/name: media-service } }
spec:
  selector: { app.kubernetes.io/name: media-service }
  ports:
    - { name: http, port: 8280, targetPort: 8280, appProtocol: http }
    - { name: metrics, port: 8281, targetPort: 8281 }
