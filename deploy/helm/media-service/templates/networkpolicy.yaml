apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: media-service, namespace: aegis-system }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: media-service } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: api-gateway } }
      ports: [{ port: 8280, protocol: TCP }]
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: aegis-observability } }
          podSelector: { matchLabels: { app.kubernetes.io/name: prometheus } }
      ports: [{ port: 8281, protocol: TCP }]
