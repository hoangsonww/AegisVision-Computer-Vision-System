image:
  repository: nvcr.io/nvidia/tritonserver
  tag: "24.10-py3"
  pullPolicy: IfNotPresent
replicaCount: 2
env: prod
logLevel: info

# GPU placement. MIG profiles are advertised via the GPU operator; this
# selector pins the deployment to nodes that publish the right resource.
gpu:
  resourceName: nvidia.com/mig-1g.10gb
  count: 1
nodeSelector:
  aegisvision.io/pool: gpu-inference
tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule

# Model repository on object storage. Triton mounts via s3fs / a CSI driver,
# OR the chart can run a model-puller init container to pre-warm the local
# directory.
modelRepository:
  uri: s3://aegis-models/triton-repo
  pullerImage: amazon/aws-cli:2.17

resources:
  requests:
    cpu: "2"
    memory: 8Gi
  limits:
    cpu: "8"
    memory: 32Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 50
  targetCPUUtilizationPercentage: 60
  # Triton-specific: scale on queue duration too. KEDA + Triton metrics
  # provides a richer signal in production.

priorityClassName: aegis-data-plane
serviceMonitor: { enabled: true, interval: 15s }

otel:
  endpoint: otel-collector.aegis-observability.svc.cluster.local:4317
