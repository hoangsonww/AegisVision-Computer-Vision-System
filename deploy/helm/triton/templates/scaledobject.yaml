{{- if and .Values.autoscaling.enabled .Values.autoscaling.useKEDA }}
# KEDA ScaledObject — scales Triton on its own queue-duration metric.
#
# `nv_inference_queue_duration_us` is the cumulative microseconds spent
# queued at the Triton scheduler. We compute a per-replica p95 over the
# last 1m via `rate()` and instruct KEDA to drive the deployment to the
# target value defined in values.yaml.
#
# Queue duration is the right scaling signal because it goes up *before*
# the glass-to-event SLO burns. CPU utilization is a lagging indicator
# on a GPU-bound workload.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: triton
  namespace: aegis-inference
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: triton
  pollingInterval: 15
  cooldownPeriod: {{ .Values.autoscaling.scaleDown.stabilizationWindowSeconds }}
  minReplicaCount: {{ .Values.autoscaling.minReplicas }}
  maxReplicaCount: {{ .Values.autoscaling.maxReplicas }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: {{ .Values.autoscaling.scaleDown.stabilizationWindowSeconds }}
          policies:
            - type: Percent
              value: 50
              periodSeconds: 60
        scaleUp:
          stabilizationWindowSeconds: {{ .Values.autoscaling.scaleUp.stabilizationWindowSeconds }}
          policies:
            - type: Percent
              value: 100
              periodSeconds: 30
            - type: Pods
              value: 4
              periodSeconds: 30
          selectPolicy: Max
  triggers:
    # Trigger 1: scale on Triton's queue duration (the right signal).
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.aegis-observability.svc.cluster.local:9090
        metricName: triton_queue_duration_us_p95
        threshold: "{{ .Values.autoscaling.queueDurationTargetMicros }}"
        query: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(nv_inference_queue_duration_us_bucket{namespace="aegis-inference"}[1m])
            )
          )
    # Trigger 2: scale on CPU as a backstop.
    - type: cpu
      metricType: Utilization
      metadata:
        value: "{{ .Values.autoscaling.targetCPUUtilizationPercentage }}"
{{- end }}
