apiVersion: v1
kind: Service
metadata:
  name: triton
  namespace: aegis-inference
  labels:
    app.kubernetes.io/name: triton
    app.kubernetes.io/part-of: aegisvision
    app.kubernetes.io/component: gpu-hot-path
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: triton
  ports:
    - name: http
      port: {{ .Values.ports.http }}
      targetPort: http
      appProtocol: http
      protocol: TCP
    - name: grpc
      port: {{ .Values.ports.grpc }}
      targetPort: grpc
      appProtocol: grpc
      protocol: TCP
    - name: metrics
      port: {{ .Values.ports.metrics }}
      targetPort: metrics
      protocol: TCP
---
# Headless service for direct pod addressing. The inference-router uses
# this for client-side load balancing across replicas, which gives it
# better latency than the round-robin VIP.
apiVersion: v1
kind: Service
metadata:
  name: triton-headless
  namespace: aegis-inference
  labels:
    app.kubernetes.io/name: triton
    app.kubernetes.io/part-of: aegisvision
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: false
  selector:
    app.kubernetes.io/name: triton
  ports:
    - name: http
      port: {{ .Values.ports.http }}
      targetPort: http
      protocol: TCP
    - name: grpc
      port: {{ .Values.ports.grpc }}
      targetPort: grpc
      protocol: TCP
