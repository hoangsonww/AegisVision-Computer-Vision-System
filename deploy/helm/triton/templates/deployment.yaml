apiVersion: apps/v1
kind: Deployment
metadata:
  name: triton
  namespace: aegis-inference
  labels: { app.kubernetes.io/name: triton }
spec:
  replicas: {{ .Values.replicaCount }}
  selector: { matchLabels: { app.kubernetes.io/name: triton } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: triton }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8002"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: triton
      priorityClassName: {{ .Values.priorityClassName | quote }}
      securityContext: { runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      nodeSelector: {{ toYaml .Values.nodeSelector | nindent 8 }}
      tolerations: {{ toYaml .Values.tolerations | nindent 8 }}
      initContainers:
        - name: model-puller
          image: "{{ .Values.modelRepository.pullerImage }}"
          command: ["/bin/sh", "-c"]
          args:
            - aws s3 sync {{ .Values.modelRepository.uri | quote }} /models --no-progress
          env:
            - { name: AWS_REGION, value: us-east-1 }
          volumeMounts:
            - { name: models, mountPath: /models }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      containers:
        - name: triton
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - tritonserver
            - --model-repository=/models
            - --strict-model-config=false
            - --allow-metrics=true
            - --allow-cpu-metrics=true
            - --allow-gpu-metrics=true
            - --metrics-port=8002
            - --log-verbose=0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          ports:
            - { name: http, containerPort: 8000 }
            - { name: grpc, containerPort: 8001 }
            - { name: metrics, containerPort: 8002 }
          env:
            - { name: AEGIS_OTLP_ENDPOINT, value: {{ .Values.otel.endpoint | quote }} }
          readinessProbe:
            httpGet: { path: /v2/health/ready, port: http }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /v2/health/live, port: http }
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu | quote }}
              memory: {{ .Values.resources.requests.memory | quote }}
              {{ .Values.gpu.resourceName }}: {{ .Values.gpu.count }}
            limits:
              cpu: {{ .Values.resources.limits.cpu | quote }}
              memory: {{ .Values.resources.limits.memory | quote }}
              {{ .Values.gpu.resourceName }}: {{ .Values.gpu.count }}
          volumeMounts:
            - { name: models, mountPath: /models, readOnly: true }
            - { name: cache, mountPath: /tmp }
      volumes:
        - name: models
          emptyDir: { sizeLimit: 50Gi }
        - name: cache
          emptyDir: { sizeLimit: 5Gi }
