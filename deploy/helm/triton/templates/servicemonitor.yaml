{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: { name: triton, namespace: aegis-inference, labels: { release: prometheus } }
spec:
  selector: { matchLabels: { app.kubernetes.io/name: triton } }
  endpoints: [{ port: metrics, interval: {{ .Values.serviceMonitor.interval }}, path: /metrics }]
{{- end }}
