apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: triton, namespace: aegis-inference }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: triton } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: inference-router } }
      ports: [{ port: 8000, protocol: TCP }, { port: 8001, protocol: TCP }]
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: aegis-observability } }
          podSelector: { matchLabels: { app.kubernetes.io/name: prometheus } }
      ports: [{ port: 8002, protocol: TCP }]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: aegis-observability } }
          podSelector: { matchLabels: { app.kubernetes.io/name: otel-collector } }
      ports: [{ port: 4317, protocol: TCP }]
    # Egress to S3 for model pulls.
    - to: [] # cluster-wide — restricted by Cilium L7 in production
      ports: [{ port: 443, protocol: TCP }]
