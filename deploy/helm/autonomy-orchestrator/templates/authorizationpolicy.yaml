apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: { name: autonomy-orchestrator, namespace: aegis-system }
spec:
  selector: { matchLabels: { app.kubernetes.io/name: autonomy-orchestrator } }
  action: ALLOW
  rules:
    - from:
        - source: { principals: [cluster.local/ns/aegis-system/sa/api-gateway] }
      to: [{ operation: { ports: ["8510"] } }]
    - from:
        - source: { principals: [cluster.local/ns/aegis-observability/sa/prometheus] }
      to: [{ operation: { ports: ["8511"] } }]
