{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: { name: dataplane-runner, namespace: aegis-streaming, labels: { release: prometheus } }
spec:
  selector: { matchLabels: { app.kubernetes.io/name: dataplane-runner } }
  endpoints: [{ port: metrics, interval: {{ .Values.serviceMonitor.interval }}, path: /metrics }]
{{- end }}
