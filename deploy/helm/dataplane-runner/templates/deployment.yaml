apiVersion: apps/v1
kind: Deployment
metadata:
  name: dataplane-runner
  namespace: aegis-streaming
  labels: { app.kubernetes.io/name: dataplane-runner }
spec:
  replicas: {{ .Values.replicaCount }}
  selector: { matchLabels: { app.kubernetes.io/name: dataplane-runner } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: dataplane-runner }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9095"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: dataplane-runner
      priorityClassName: {{ .Values.priorityClassName | quote }}
      securityContext: { runAsNonRoot: true, runAsUser: 65532, fsGroup: 65532, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: dataplane-runner
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          ports:
            - { name: metrics, containerPort: 9095 }
          env:
            - { name: AEGIS_ENV, value: {{ .Values.env | quote }} }
            - { name: AEGIS_VERSION, value: {{ .Values.image.tag | quote }} }
            - { name: AEGIS_LOG_LEVEL, value: {{ .Values.logLevel | quote }} }
            - { name: AEGIS_HEALTH_ADDR, value: ":9095" }
            - { name: AEGIS_NATS_URL, value: {{ .Values.nats.url | quote }} }
            - { name: AEGIS_OTLP_ENDPOINT, value: {{ .Values.otel.endpoint | quote }} }
          readinessProbe: { httpGet: { path: /readyz, port: metrics }, initialDelaySeconds: 2, periodSeconds: 5 }
          livenessProbe:  { httpGet: { path: /healthz, port: metrics }, initialDelaySeconds: 10, periodSeconds: 10 }
          resources: {{ toYaml .Values.resources | nindent 12 }}
