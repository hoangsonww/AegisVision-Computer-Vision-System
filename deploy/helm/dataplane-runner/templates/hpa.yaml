apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: dataplane-runner, namespace: aegis-streaming }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: dataplane-runner }
  minReplicas: 3
  maxReplicas: 60
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
