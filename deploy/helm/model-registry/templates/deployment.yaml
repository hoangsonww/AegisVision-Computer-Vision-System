apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-registry
  namespace: aegis-system
  labels: { app.kubernetes.io/name: model-registry }
spec:
  replicas: {{ .Values.replicaCount }}
  selector: { matchLabels: { app.kubernetes.io/name: model-registry } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: model-registry }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9097"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: model-registry
      priorityClassName: {{ .Values.priorityClassName | quote }}
      securityContext: { runAsNonRoot: true, runAsUser: 65532, fsGroup: 65532, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: model-registry
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          ports:
            - { name: grpc, containerPort: 9094 }
            - { name: metrics, containerPort: 9097 }
          env:
            - { name: AEGIS_ENV, value: {{ .Values.env | quote }} }
            - { name: AEGIS_VERSION, value: {{ .Values.image.tag | quote }} }
            - { name: AEGIS_LOG_LEVEL, value: {{ .Values.logLevel | quote }} }
            - { name: AEGIS_GRPC_ADDR, value: ":9094" }
            - { name: AEGIS_HEALTH_ADDR, value: ":9097" }
            - { name: AEGIS_DB_DRIVER, value: {{ .Values.db.driver | quote }} }
            - name: AEGIS_DB_DSN
              valueFrom:
                secretKeyRef: { name: model-registry-db, key: dsn }
            - { name: AEGIS_OTLP_ENDPOINT, value: {{ .Values.otel.endpoint | quote }} }
          readinessProbe: { httpGet: { path: /readyz, port: metrics }, initialDelaySeconds: 2, periodSeconds: 5 }
          livenessProbe:  { httpGet: { path: /healthz, port: metrics }, initialDelaySeconds: 10, periodSeconds: 10 }
          resources: {{ toYaml .Values.resources | nindent 12 }}
