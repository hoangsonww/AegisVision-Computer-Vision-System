apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: { name: active-learning-service, namespace: aegis-system }
spec:
  selector: { matchLabels: { app.kubernetes.io/name: active-learning-service } }
  action: ALLOW
  rules:
    - from:
        - source: { principals: [cluster.local/ns/aegis-system/sa/annotation-service, cluster.local/ns/aegis-system/sa/api-gateway] }
      to: [{ operation: { ports: ["8440"] } }]
    - from:
        - source: { principals: [cluster.local/ns/aegis-observability/sa/prometheus] }
      to: [{ operation: { ports: ["8441"] } }]
