apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: { name: realtime-hub, namespace: aegis-system }
spec:
  selector: { matchLabels: { app.kubernetes.io/name: realtime-hub } }
  action: ALLOW
  rules:
    - from:
        - source: { principals: [cluster.local/ns/aegis-system/sa/api-gateway] }
      to: [{ operation: { ports: ["8220"] } }]
    - from:
        - source: { principals: [cluster.local/ns/aegis-observability/sa/prometheus] }
      to: [{ operation: { ports: ["8221"] } }]
