apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: aegis-system
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: control-plane
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/component: control-plane
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: api-gateway
      priorityClassName: {{ .Values.priorityClassName | quote }}
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: {{ .Values.podSecurity.runAsNonRoot }}
        runAsUser: {{ .Values.podSecurity.runAsUser }}
        fsGroup: {{ .Values.podSecurity.fsGroup }}
        seccompProfile:
          type: {{ .Values.podSecurity.seccompProfile }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: api-gateway
      containers:
        - name: api-gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: {{ .Values.podSecurity.readOnlyRootFilesystem }}
            capabilities:
              drop: {{ toYaml .Values.podSecurity.drop | nindent 16 }}
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 8081
          env:
            - name: AEGIS_ENV
              value: {{ .Values.env | quote }}
            - name: AEGIS_VERSION
              value: {{ .Values.image.tag | quote }}
            - name: AEGIS_LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: AEGIS_HTTP_ADDR
              value: ":8080"
            - name: AEGIS_HEALTH_ADDR
              value: ":8081"
            - name: AEGIS_PIPELINE_SERVICE_ADDR
              value: {{ .Values.pipelineService.addr | quote }}
            - name: AEGIS_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            {{- if .Values.opa.enabled }}
            - name: AEGIS_OPA_ENDPOINT
              value: {{ .Values.opa.endpoint | quote }}
            {{- end }}
            - name: AEGIS_CURSOR_KEY
              valueFrom:
                secretKeyRef:
                  name: api-gateway-secrets
                  key: cursor_key
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        {{- if .Values.opa.enabled }}
        - name: opa
          image: "{{ .Values.opa.image.repository }}:{{ .Values.opa.image.tag }}"
          args:
            - "run"
            - "--server"
            - "--addr=127.0.0.1:8181"
            - "--diagnostic-addr=127.0.0.1:8282"
            - "/policy"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: [ALL]
          ports:
            - name: opa
              containerPort: 8181
          readinessProbe:
            httpGet:
              path: /health?bundles
              port: 8282
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 256Mi }
          volumeMounts:
            - name: opa-policy
              mountPath: /policy
              readOnly: true
        {{- end }}
      volumes:
        {{- if .Values.opa.enabled }}
        - name: opa-policy
          configMap:
            name: api-gateway-opa-policy
        {{- end }}
