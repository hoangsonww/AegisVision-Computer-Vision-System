apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: aegis-system
  labels:
    app.kubernetes.io/name: api-gateway
spec:
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - name: http
      port: 80
      targetPort: 8080
      appProtocol: http
    - name: metrics
      port: 8081
      targetPort: 8081
