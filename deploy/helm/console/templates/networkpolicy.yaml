apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: console
  namespace: aegis-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: console
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: api-gateway } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: istio-ingress } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: aegis-observability } }
      ports:
        - { protocol: TCP, port: 8090 }
        - { protocol: TCP, port: 9090 }
  egress:
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: api-gateway } }
      ports: [{ protocol: TCP, port: 8080 }]
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
