apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: console
  namespace: aegis-system
spec:
  selector: { matchLabels: { app.kubernetes.io/name: console } }
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/aegis-system/sa/api-gateway
              - cluster.local/ns/istio-ingress/sa/istio-ingress
      to:
        - operation: { ports: ["8090"] }
    - from:
        - source:
            principals: [cluster.local/ns/aegis-observability/sa/prometheus]
      to:
        - operation: { ports: ["9090"] }
