image:
  repository: ghcr.io/hoangsonww/console
  tag: 0.1.0
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  port: 80
  containerPort: 8090
  metricsPort: 9090

# Where the console points its API client. In-cluster, this is the api-gateway
# Service DNS. Outside the cluster, the user fronts both behind one host.
apiBaseUrl: "http://api-gateway.aegis-system.svc.cluster.local:8080"

resources:
  requests: { cpu: "50m", memory: "128Mi" }
  limits:   { cpu: "500m", memory: "512Mi" }

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  cpuUtilization: 70

pdb:
  enabled: true
  minAvailable: 1

serviceMonitor:
  enabled: true
  interval: 30s
  path: /api/metrics

securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile: { type: RuntimeDefault }

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: [ALL] }
