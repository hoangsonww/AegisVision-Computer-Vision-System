apiVersion: v1
kind: Service
metadata: { name: event-service, namespace: aegis-system, labels: { app.kubernetes.io/name: event-service } }
spec:
  selector: { app.kubernetes.io/name: event-service }
  ports:
    - { name: http, port: 8090, targetPort: 8090, appProtocol: http }
    - { name: metrics, port: 8091, targetPort: 8091 }
