apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: event-service, namespace: aegis-system }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: event-service } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app.kubernetes.io/name: api-gateway } } }]
      ports: [{ port: 8090, protocol: TCP }]
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: aegis-observability } }
          podSelector: { matchLabels: { app.kubernetes.io/name: prometheus } }
      ports: [{ port: 8091, protocol: TCP }]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: aegis-data } }
          podSelector: { matchLabels: { app.kubernetes.io/name: nats } }
      ports: [{ port: 4222, protocol: TCP }]
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: aegis-observability } }
          podSelector: { matchLabels: { app.kubernetes.io/name: otel-collector } }
      ports: [{ port: 4317, protocol: TCP }]
