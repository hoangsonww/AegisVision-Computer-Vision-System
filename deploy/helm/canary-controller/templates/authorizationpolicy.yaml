apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: { name: canary-controller, namespace: aegis-system }
spec:
  selector: { matchLabels: { app.kubernetes.io/name: canary-controller } }
  action: ALLOW
  rules:
    - from:
        - source: { principals: [cluster.local/ns/aegis-system/sa/api-gateway, cluster.local/ns/aegis-system/sa/model-registry] }
      to: [{ operation: { ports: ["8460"] } }]
    - from:
        - source: { principals: [cluster.local/ns/aegis-observability/sa/prometheus] }
      to: [{ operation: { ports: ["8461"] } }]
