apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: canary-controller, namespace: aegis-system }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: canary-controller } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: api-gateway } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: model-registry } }
      ports: [{ port: 8460, protocol: TCP }]
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: aegis-observability } }
          podSelector: { matchLabels: { app.kubernetes.io/name: prometheus } }
      ports: [{ port: 8461, protocol: TCP }]
