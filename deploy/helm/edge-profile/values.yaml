# Edge profile — what runs at a camera site on k3s. Per ADR-0005 the edge
# uses the SAME platform code, just scaled down: ingest + detect + tracker +
# lightweight rule + edge-gateway. Pipelines/streams/models are pulled from
# core via control-plane sync; results flow back via the gateway's
# store-and-forward queue.
edge:
  # Replicas per service for the edge node (typically 1).
  replicas: 1
  # Core endpoints — pulled from the platform when paired.
  core:
    natsURL: nats://core-nats.aegisvision.example:4222
    pipelineService: pipeline-service.core.aegisvision.example:9090
    streamManager: stream-manager.core.aegisvision.example:9092
  # Aggressive retention; edge stores no media.
  retentionHours: 1
  # Light operator chain — no LLM, no semantic-search, no model registry.
  enabledServices:
    - edge-gateway
    - dataplane-runner
    - inference-router
    - event-service     # ring only; no ClickHouse
  disabledServices:
    - llm-gateway       # intelligence tier — agents and LLM ops live on the core
    - agent-service     # intelligence tier — agent runtime is core-only
    - policy-gate-service  # intelligence tier — gate decisions flow to core
    - knowledge-service # intelligence tier — RAG corpus is core-only
    - active-learning-service # intelligence tier — labeling flows to core
    - nlq-service       # intelligence tier — NL query lives on core
    - semantic-search
    - training-orchestrator
    - dataset-service
    - annotation-service
    - cost-accounting
    - audit-service     # forwarded to core, not stored locally
    - canary-controller       # adaptive autonomy — promotion/rollback lives on core
    - shadow-inference-service # adaptive autonomy — comparison runs on core
    - drift-detection-service # adaptive autonomy — drift evaluation lives on core
    - slo-watchdog            # adaptive autonomy — SLO eval needs core's Prometheus
    - prefetch-service        # adaptive autonomy — predictor needs core history
    - autonomy-orchestrator   # adaptive autonomy — continuous autonomy lives on core
  # CPU-only inference unless edge node has a GPU.
  inferenceMode: cpu
  resources:
    edgeGateway:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: "1", memory: 512Mi }
    dataplaneRunner:
      requests: { cpu: 500m, memory: 256Mi }
      limits: { cpu: "2", memory: 1Gi }
    inferenceRouter:
      requests: { cpu: 250m, memory: 256Mi }
      limits: { cpu: "1", memory: 512Mi }
