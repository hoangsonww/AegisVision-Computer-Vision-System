image: { repository: aegisvision/audit-service, tag: "0.1.0", pullPolicy: IfNotPresent }
replicaCount: 2
env: prod
logLevel: info
db:
  driver: postgres
  dsn: postgresql://aegis:aegis@postgres.aegis-data.svc:5432/audit?sslmode=require
nats:
  url: nats://nats.aegis-data.svc.cluster.local:4222
otel:
  endpoint: otel-collector.aegis-observability.svc.cluster.local:4317
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits:   { cpu: "1",  memory: 512Mi }
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
priorityClassName: aegis-control-plane
serviceMonitor: { enabled: true, interval: 30s }
