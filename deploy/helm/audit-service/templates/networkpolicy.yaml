apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: audit-service, namespace: aegis-system }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: audit-service } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: api-gateway } }
      ports: [{ port: 8092, protocol: TCP }]
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: aegis-observability } }
          podSelector: { matchLabels: { app.kubernetes.io/name: prometheus } }
      ports: [{ port: 8093, protocol: TCP }]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: aegis-data } }
          podSelector: { matchLabels: { app.kubernetes.io/name: nats } }
      ports: [{ port: 4222, protocol: TCP }]
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: aegis-data } }
          podSelector: { matchLabels: { app.kubernetes.io/name: postgres } }
      ports: [{ port: 5432, protocol: TCP }]
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: aegis-observability } }
          podSelector: { matchLabels: { app.kubernetes.io/name: otel-collector } }
      ports: [{ port: 4317, protocol: TCP }]
