apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipeline-service
  namespace: aegis-system
  labels:
    app.kubernetes.io/name: pipeline-service
    app.kubernetes.io/component: control-plane
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: pipeline-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pipeline-service
        app.kubernetes.io/component: control-plane
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: pipeline-service
      priorityClassName: {{ .Values.priorityClassName | quote }}
      securityContext:
        runAsNonRoot: {{ .Values.podSecurity.runAsNonRoot }}
        runAsUser: {{ .Values.podSecurity.runAsUser }}
        fsGroup: {{ .Values.podSecurity.fsGroup }}
        seccompProfile:
          type: {{ .Values.podSecurity.seccompProfile }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: pipeline-service
      containers:
        - name: pipeline-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: {{ .Values.podSecurity.readOnlyRootFilesystem }}
            capabilities:
              drop: {{ toYaml .Values.podSecurity.drop | nindent 16 }}
          ports:
            - name: grpc
              containerPort: 9090
            - name: metrics
              containerPort: 9091
          env:
            - name: AEGIS_ENV
              value: {{ .Values.env | quote }}
            - name: AEGIS_VERSION
              value: {{ .Values.image.tag | quote }}
            - name: AEGIS_LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: AEGIS_GRPC_ADDR
              value: ":9090"
            - name: AEGIS_HEALTH_ADDR
              value: ":9091"
            - name: AEGIS_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            - name: AEGIS_SEED_DEMO
              value: "false"
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
