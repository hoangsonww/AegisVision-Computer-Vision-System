apiVersion: v1
kind: Service
metadata: { name: inference-router, namespace: aegis-inference, labels: { app.kubernetes.io/name: inference-router } }
spec:
  selector: { app.kubernetes.io/name: inference-router }
  ports:
    - { name: http, port: 8094, targetPort: 8094, appProtocol: http }
    - { name: metrics, port: 8095, targetPort: 8095 }
