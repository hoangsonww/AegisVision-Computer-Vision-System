apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-router
  namespace: aegis-inference
  labels:
    app.kubernetes.io/name: inference-router
    app.kubernetes.io/part-of: aegisvision
    app.kubernetes.io/component: gpu-front-door
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inference-router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inference-router
        app.kubernetes.io/part-of: aegisvision
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8095"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: inference-router
      priorityClassName: {{ .Values.priorityClassName | quote }}
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: inference-router
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8094
              protocol: TCP
            - name: metrics
              containerPort: 8095
              protocol: TCP
          env:
            - name: AEGIS_ENV
              value: {{ .Values.env | quote }}
            - name: AEGIS_VERSION
              value: {{ .Values.image.tag | quote }}
            - name: AEGIS_LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: AEGIS_HTTP_ADDR
              value: ":8094"
            - name: AEGIS_HEALTH_ADDR
              value: ":8095"
            - name: AEGIS_TRITON_URL
              value: {{ .Values.triton.url | quote }}
            - name: AEGIS_TRITON_TIMEOUT_SEC
              value: "{{ .Values.triton.perRequestTimeoutSeconds }}"
            - name: AEGIS_TRITON_MAX_RETRIES
              value: "{{ .Values.triton.maxRetries }}"
            - name: AEGIS_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          # PreStop sleep lets the service mesh remove this pod from
          # the endpoint set before the inference-router begins
          # draining. Without it, brief 503s appear on rolling updates.
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
          resources: {{ toYaml .Values.resources | nindent 12 }}
