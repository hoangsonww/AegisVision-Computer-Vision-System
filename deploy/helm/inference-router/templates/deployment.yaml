apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-router
  namespace: aegis-inference
  labels: { app.kubernetes.io/name: inference-router }
spec:
  replicas: {{ .Values.replicaCount }}
  selector: { matchLabels: { app.kubernetes.io/name: inference-router } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: inference-router }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8095"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: inference-router
      priorityClassName: {{ .Values.priorityClassName | quote }}
      securityContext: { runAsNonRoot: true, runAsUser: 65532, fsGroup: 65532, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: inference-router
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          ports:
            - { name: http, containerPort: 8094 }
            - { name: metrics, containerPort: 8095 }
          env:
            - { name: AEGIS_ENV, value: {{ .Values.env | quote }} }
            - { name: AEGIS_VERSION, value: {{ .Values.image.tag | quote }} }
            - { name: AEGIS_LOG_LEVEL, value: {{ .Values.logLevel | quote }} }
            - { name: AEGIS_HTTP_ADDR, value: ":8094" }
            - { name: AEGIS_HEALTH_ADDR, value: ":8095" }
            - { name: AEGIS_TRITON_URL, value: {{ .Values.triton.url | quote }} }
            - { name: AEGIS_OTLP_ENDPOINT, value: {{ .Values.otel.endpoint | quote }} }
          readinessProbe: { httpGet: { path: /readyz, port: metrics }, initialDelaySeconds: 2, periodSeconds: 5 }
          livenessProbe:  { httpGet: { path: /healthz, port: metrics }, initialDelaySeconds: 10, periodSeconds: 10 }
          resources: {{ toYaml .Values.resources | nindent 12 }}
