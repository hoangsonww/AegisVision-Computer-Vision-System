apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: { name: llm-gateway, namespace: aegis-system }
spec:
  selector: { matchLabels: { app.kubernetes.io/name: llm-gateway } }
  action: ALLOW
  rules:
    - from:
        - source: { principals: [cluster.local/ns/aegis-system/sa/agent-service, cluster.local/ns/aegis-system/sa/nlq-service, cluster.local/ns/aegis-system/sa/knowledge-service, cluster.local/ns/aegis-system/sa/api-gateway] }
      to: [{ operation: { ports: ["8400"] } }]
    - from:
        - source: { principals: [cluster.local/ns/aegis-observability/sa/prometheus] }
      to: [{ operation: { ports: ["8401"] } }]
