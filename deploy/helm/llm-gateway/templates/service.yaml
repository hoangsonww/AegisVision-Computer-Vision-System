apiVersion: v1
kind: Service
metadata: { name: llm-gateway, namespace: aegis-system, labels: { app.kubernetes.io/name: llm-gateway } }
spec:
  selector: { app.kubernetes.io/name: llm-gateway }
  ports:
    - { name: http, port: 8400, targetPort: 8400, appProtocol: http }
    - { name: metrics, port: 8401, targetPort: 8401 }
