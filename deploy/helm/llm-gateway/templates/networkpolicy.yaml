apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: llm-gateway, namespace: aegis-system }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: llm-gateway } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: agent-service } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: nlq-service } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: knowledge-service } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: api-gateway } }
      ports: [{ port: 8400, protocol: TCP }]
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: aegis-observability } }
          podSelector: { matchLabels: { app.kubernetes.io/name: prometheus } }
      ports: [{ port: 8401, protocol: TCP }]
