apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: auth-proxy, namespace: aegis-system }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: auth-proxy } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: api-gateway } }
      ports: [{ port: 8310, protocol: TCP }]
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: aegis-observability } }
          podSelector: { matchLabels: { app.kubernetes.io/name: prometheus } }
      ports: [{ port: 8311, protocol: TCP }]
