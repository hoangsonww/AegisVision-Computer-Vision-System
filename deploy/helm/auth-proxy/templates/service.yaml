apiVersion: v1
kind: Service
metadata: { name: auth-proxy, namespace: aegis-system, labels: { app.kubernetes.io/name: auth-proxy } }
spec:
  selector: { app.kubernetes.io/name: auth-proxy }
  ports:
    - { name: http, port: 8310, targetPort: 8310, appProtocol: http }
    - { name: metrics, port: 8311, targetPort: 8311 }
