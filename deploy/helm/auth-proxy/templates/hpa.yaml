{{"{{- if .Values.autoscaling.enabled }}"}}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: auth-proxy, namespace: aegis-system }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: auth-proxy }
  minReplicas: {{"{{ .Values.autoscaling.minReplicas }}"}}
  maxReplicas: {{"{{ .Values.autoscaling.maxReplicas }}"}}
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: {{"{{ .Values.autoscaling.targetCPUUtilizationPercentage }}"}} } }
{{"{{- end }}"}}
