apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: { name: auth-proxy, namespace: aegis-system }
spec:
  selector: { matchLabels: { app.kubernetes.io/name: auth-proxy } }
  action: ALLOW
  rules:
    - from:
        - source: { principals: [cluster.local/ns/aegis-system/sa/api-gateway] }
      to: [{ operation: { ports: ["8310"] } }]
    - from:
        - source: { principals: [cluster.local/ns/aegis-observability/sa/prometheus] }
      to: [{ operation: { ports: ["8311"] } }]
