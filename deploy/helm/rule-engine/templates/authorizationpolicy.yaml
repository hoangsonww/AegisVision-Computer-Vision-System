apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: { name: rule-engine, namespace: aegis-system }
spec:
  selector: { matchLabels: { app.kubernetes.io/name: rule-engine } }
  action: ALLOW
  rules:
    - from:
        - source: { principals: [cluster.local/ns/aegis-system/sa/api-gateway] }
      to: [{ operation: { ports: ["8210"] } }]
    - from:
        - source: { principals: [cluster.local/ns/aegis-observability/sa/prometheus] }
      to: [{ operation: { ports: ["8211"] } }]
