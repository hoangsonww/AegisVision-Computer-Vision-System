{{"{{- if .Values.serviceMonitor.enabled }}"}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: { name: rule-engine, namespace: aegis-system, labels: { release: prometheus } }
spec:
  selector: { matchLabels: { app.kubernetes.io/name: rule-engine } }
  endpoints: [{ port: metrics, interval: {{"{{ .Values.serviceMonitor.interval }}"}}, path: /metrics }]
{{"{{- end }}"}}
