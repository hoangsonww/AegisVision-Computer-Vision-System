# Per-tenant K8s ResourceQuota + LimitRange. Materialized by the tenant
# lifecycle workflow on tenant creation; one set of these per tenant in the
# tenant's optional `aegis-tenant-<id>` namespace.
#
# Numbers track the standard-tier defaults from tenant-service. Enterprise
# tier deploys a separate template with larger ceilings.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tenant-quota
  namespace: aegis-tenant-${TENANT_ID}
spec:
  hard:
    # Compute
    requests.cpu: "32"
    requests.memory: "128Gi"
    limits.cpu: "128"
    limits.memory: "512Gi"
    # Workload counts
    pods: "200"
    services: "50"
    persistentvolumeclaims: "20"
    # Storage
    requests.storage: "1Ti"
    # GPU (only enterprise tier non-zero; standard = 0)
    requests.nvidia.com/gpu: "0"
    limits.nvidia.com/gpu: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: tenant-defaults
  namespace: aegis-tenant-${TENANT_ID}
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "8"
        memory: 32Gi
    - type: Pod
      max:
        cpu: "16"
        memory: 64Gi
---
# Tenant priority class — preempts best-effort but is preempted by platform
# critical workloads.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata: { name: aegis-tenant-${TENANT_ID} }
value: 500000
description: "Tenant ${TENANT_ID} workloads."
