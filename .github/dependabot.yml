# ──────────────────────────────────────────────────────────────────────────
# Dependabot version-update PRs are PAUSED (too much PR noise).
#
# This config stays VALID on purpose: Dependabot requires a non-empty
# `updates:` key, so we cannot just comment everything out — that fails
# config validation. Instead every ecosystem is kept but throttled with
# `open-pull-requests-limit: 0`, which disables version-update PRs.
#
#   • To RE-ENABLE an ecosystem: set its `open-pull-requests-limit` back to
#     a positive number (e.g. 10).
#   • To PAUSE again: set it back to 0.
#
# Security/CVE update PRs are NOT affected by this limit — they still flow
# (they are governed by the repo's security settings, not this file).
# ──────────────────────────────────────────────────────────────────────────
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0 # set to 10 to re-enable
    labels:
      - dependencies
      - go
    reviewers:
      - hoangsonww
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0 # set to 10 to re-enable
    labels:
      - dependencies
