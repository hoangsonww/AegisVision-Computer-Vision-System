version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - go
    reviewers:
      - hoangsonww
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
