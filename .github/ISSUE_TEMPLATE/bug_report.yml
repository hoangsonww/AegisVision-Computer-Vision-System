name: 🐛 Bug Report
description: Report a defect, regression, or unexpected behaviour.
title: "[Bug]: "
labels: ["bug", "triage"]
assignees:
  - hoangsonww
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report!

        Before filing, please:
        - Search existing issues to avoid duplicates.
        - Try `docs/troubleshooting.md` for common causes.
        - **Do not** file security vulnerabilities here — see `SECURITY.md`.

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Which part of the platform is affected?
      options:
        - api-gateway
        - control plane (pipeline / stream / model / dataset / annotation / training / media / tenant / auth / audit)
        - data plane (dataplane-runner / inference-router / gpu-scheduler / rule-engine / event-service / realtime-hub / notification / edge-gateway)
        - intelligence (llm-gateway / agent / policy-gate / knowledge / active-learning / nlq)
        - adaptive autonomy (canary / shadow / drift / slo-watchdog / prefetch / autonomy-orchestrator)
        - compliance / cost / metering / semantic-search
        - deploy / helm / argocd
        - tools (conformance / integration / loadtest / dr-drills / airgap)
        - docs
        - other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: AegisVision version
      description: From CHANGELOG.md or `git describe`.
      placeholder: "v0.5.0"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Step-by-step. Include exact commands.
      render: bash
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / output / trace ID
      description: Paste structured logs / trace IDs / problem+json responses.
      render: text

  - type: dropdown
    id: env
    attributes:
      label: Environment
      options:
        - Local (walking skeleton)
        - Local (docker-compose dev)
        - Kubernetes (online ArgoCD)
        - Kubernetes (air-gapped bundle)
        - Edge (k3s)
        - Other
    validations:
      required: true

  - type: input
    id: k8s-version
    attributes:
      label: Kubernetes version (if applicable)
      placeholder: "1.28.4"

  - type: checkboxes
    id: confirms
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues + discussions before filing.
          required: true
        - label: I read `docs/troubleshooting.md`.
          required: true
        - label: This is not a security vulnerability (those go via `SECURITY.md`).
          required: true
