name: Lint

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  golangci-lint:
    name: golangci-lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Lint the heavy-traffic modules first. Lighter services rely on
        # the same golden-path code and are covered by the build/test
        # job; we surface lint at the entry points where it matters most.
        module:
          - pkg/platform
          - pkg/bus
          - pkg/dataplane
          - pkg/llm
          - pkg/agent
          - pkg/canary
          - pkg/autonomy
          - services/api-gateway
          - services/inference-router
          - services/agent-service
          - services/policy-gate-service
          - services/canary-controller
          - services/event-service
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # golangci-lint v2.12+ is built with Go 1.26 and can type-check
          # source files that declare `go 1.26` in go.mod. Earlier v2.x
          # releases (e.g. v2.1, built with Go 1.24) panic on those files.
          # The v2 schema in .golangci.yml is supported from v2.0 onward.
          version: v2.12.2
          working-directory: ${{ matrix.module }}
          args: --config=${{ github.workspace }}/.golangci.yml --timeout=5m

  shellcheck:
    name: shellcheck (tools/scripts + tools/airgap + tools/dr-drills)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@master
        env:
          # SC2086 / SC2046: word-splitting on unquoted expansions — used
          # intentionally in our scripts.
          # SC2034: unused variable — the dr-drills scripts parse CLI args
          # into vars some of which are only consumed by subcommands; the
          # noise outweighs the value.
          # SC2044: for-loop over find — fine for our small fixed trees;
          # we run find with predictable, hyphen-safe paths.
          SHELLCHECK_OPTS: -e SC2086 -e SC2046 -e SC2034 -e SC2044
        with:
          severity: warning
          scandir: ./tools
