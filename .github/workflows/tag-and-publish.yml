# Tag & publish. release-please cuts the version + CHANGELOG when
# semantic-commit messages land on master. On tag creation the
# air-gap bundle workflow takes over.
name: Tag & publish
on:
  push:
    branches: [main, master]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    name: cut release
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

  airgap-bundle:
    name: air-gapped bundle
    # Wait for promote-image so the VERSION tag exists before we pull it.
    needs: [release-please, promote-image]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      packages: read
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
      REGISTRY: ghcr.io/hoangsonww
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: set up crane + cosign + syft + zstd
        run: |
          set -e
          curl -sSL "https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin crane
          curl -sSL "https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64" \
            -o /usr/local/bin/cosign && sudo chmod +x /usr/local/bin/cosign
          curl -sSL "https://raw.githubusercontent.com/anchore/syft/main/install.sh" | sudo sh -s -- -b /usr/local/bin
          sudo apt-get update && sudo apt-get install -y zstd
      - name: log in to ghcr
        run: echo "${{ secrets.GITHUB_TOKEN }}" | crane auth login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: install helm
        uses: azure/setup-helm@v4
      - name: build bundle
        run: |
          ./tools/airgap/build.sh \
            --version "${VERSION}" \
            --registry "${REGISTRY}" \
            --out dist
      - name: cosign attest the bundle
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          BUNDLE=$(ls dist/aegisvision-airgap-*.tar.zst | head -1)
          cosign sign-blob --yes --bundle "${BUNDLE}.cosign.bundle" "$BUNDLE"
      - name: attach bundle to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            dist/aegisvision-airgap-*.tar.zst
            dist/aegisvision-airgap-*.tar.zst.sha256
            dist/aegisvision-airgap-*.tar.zst.cosign.bundle

  promote-image:
    name: promote aegisvision image (ci-sha → version + latest)
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
      REGISTRY: ghcr.io/hoangsonww
    steps:
      - uses: imjasonh/setup-crane@v0.4
      - name: log in to ghcr
        run: echo "${{ secrets.GITHUB_TOKEN }}" | crane auth login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: wait for build-and-verify to push the image
        env:
          SHA: ${{ github.sha }}
        # Build & verify runs in parallel — it can take ~10 min to push. Poll
        # the registry every 20s for up to 20 min for either tag to appear.
        run: |
          deadline=$((SECONDS + 1200))
          found=""
          while [ $SECONDS -lt $deadline ]; do
            for candidate in "${REGISTRY}/aegisvision:ci-${SHA}" "${REGISTRY}/aegisvision:${SHA}"; do
              if crane manifest "$candidate" >/dev/null 2>&1; then
                found="$candidate"
                break 2
              fi
            done
            echo "image not yet available; waiting 20s (${SECONDS}s elapsed)…"
            sleep 20
          done
          if [ -z "$found" ]; then
            echo "::error::aegisvision:ci-${SHA} never appeared in registry — Build & verify may have failed"
            exit 1
          fi
          echo "SRC=$found" >> "$GITHUB_ENV"
      - name: tag ci-sha as version + latest
        run: |
          echo "promoting ${SRC} → ${VERSION} + latest"
          crane tag "${SRC}" "${VERSION}"
          crane tag "${SRC}" "latest"
